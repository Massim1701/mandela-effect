<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mandela Effekt – Vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#09090b;--card:#18181b;--border:#3f3f46;
  --primary:#a855f7;--primary-dim:#7c3aed;
  --text:#fafafa;--muted:#a1a1aa;
  --green:#22c55e;--red:#ef4444;
}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh;overflow:hidden}
.screen{display:none;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.screen.active{display:flex}

/* WAITING */
#s-waiting{background:radial-gradient(ellipse at center,#1a0a2e 0%,#09090b 70%)}
.wait-logo{font-size:clamp(2rem,6vw,4rem);font-weight:700;letter-spacing:-.02em;text-align:center;line-height:1.1}
.wait-logo span{color:var(--primary)}
.wait-sub{margin-top:16px;color:var(--muted);font-size:1.1rem;text-align:center}
.pulse-ring{width:120px;height:120px;border:2px solid var(--primary);border-radius:50%;margin:40px auto;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.15);opacity:.3}}
.inner-ring{width:80px;height:80px;border:2px solid var(--primary-dim);border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);animation:pulse 2s ease-in-out infinite .5s}
.ring-wrap{position:relative;width:120px;height:120px;margin:40px auto}

/* VOTING */
#s-voting{background:var(--bg);flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.vote-header{text-align:center;width:100%;max-width:900px;margin-bottom:20px}
.pair-counter{color:var(--primary);font-size:.9rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.vote-title{font-size:clamp(1.5rem,3vw,2.2rem);font-weight:700;margin:8px 0}
.vote-desc{color:var(--muted);font-size:1rem}
.vote-img-wrap{position:relative;width:100%;max-width:900px;border-radius:20px;overflow:hidden;cursor:pointer;border:3px solid var(--border);transition:all .3s ease}
.vote-img-wrap:hover:not(.voted){border-color:var(--primary);box-shadow:0 0 40px rgba(168,85,247,.3)}
.vote-img-wrap.voted{cursor:default;border-color:var(--green)}
.vote-img-wrap img{width:100%;max-height:500px;object-fit:cover;display:block}
.vote-count-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.vote-count-big{font-size:clamp(4rem,12vw,8rem);font-weight:700;color:#fff;line-height:1;text-shadow:0 4px 24px rgba(0,0,0,.8)}
.vote-count-label{font-size:1rem;color:rgba(255,255,255,.8);font-weight:500;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.click-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);backdrop-filter:blur(8px);color:#fff;padding:10px 24px;border-radius:999px;font-size:.9rem;font-weight:600;white-space:nowrap}
.voted-check{position:absolute;top:16px;right:16px;background:var(--green);color:#fff;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;display:none}
.live-dot{width:8px;height:8px;background:var(--green);border-radius:50%;animation:blink 1s ease-in-out infinite;display:inline-block}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* RESULTS */
#s-results{background:var(--bg);flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.result-header{text-align:center;width:100%;max-width:900px;margin-bottom:20px}
.result-title{font-size:clamp(1.5rem,3vw,2rem);font-weight:700;margin:8px 0}
.result-sub{color:var(--muted)}
.result-img-wrap{position:relative;width:100%;max-width:900px;border-radius:20px;overflow:hidden;border:3px solid var(--green)}
.result-img-wrap img{width:100%;max-height:460px;object-fit:cover;display:block}
.result-stats-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(2px)}
.r-stat-big{font-size:clamp(3rem,10vw,6rem);font-weight:700;color:#fff;line-height:1;text-shadow:0 4px 24px rgba(0,0,0,.8)}
.r-stat-label{font-size:1.1rem;color:rgba(255,255,255,.9);margin-top:8px;font-weight:500;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.r-stat-sub{font-size:.9rem;color:rgba(255,255,255,.6);margin-top:4px}
.r-bar-wrap{width:80%;max-width:500px;background:rgba(255,255,255,.2);border-radius:8px;height:12px;overflow:hidden;margin-top:20px}
.r-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),#ec4899);border-radius:8px;transition:width 1.2s ease}

/* SUMMARY */
#s-summary{background:var(--bg);justify-content:flex-start;padding:24px;overflow-y:auto}
.summary-header{text-align:center;width:100%;max-width:1200px;margin-bottom:32px}
.summary-title{font-size:clamp(1.8rem,4vw,2.5rem);font-weight:700}
.summary-title span{color:var(--primary)}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;width:100%;max-width:1200px}
.sum-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.sum-card img{width:100%;height:120px;object-fit:cover;opacity:.6}
.sum-body{padding:12px}
.sum-num{font-size:.75rem;color:var(--muted);margin-bottom:4px}
.sum-name{font-size:.9rem;font-weight:600;margin-bottom:10px}
.sum-bars{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.sum-bar-row{display:flex;flex-direction:column;gap:2px}
.sum-bar-track{background:#27272a;border-radius:4px;height:8px;overflow:hidden}
.sum-bar-fill{height:100%;border-radius:4px;transition:width 1s ease}
.fill-left{background:var(--primary-dim)}
.fill-right{background:#0891b2}
.sum-bar-info{font-size:.7rem;color:var(--muted);text-align:center}
</style>
</head>
<body>

<!-- WAITING -->
<div class="screen active" id="s-waiting">
  <div class="ring-wrap">
    <div class="pulse-ring"></div>
    <div class="inner-ring"></div>
  </div>
  <div class="wait-logo">Mandela<br><span>Effekt</span></div>
  <p class="wait-sub">Warte auf den Admin…</p>
</div>

<!-- VOTING: Bild 1 -->
<div class="screen" id="s-voting">
  <div class="vote-header">
    <div class="pair-counter" id="v-counter">Beispiel 1 von 20</div>
    <h1 class="vote-title" id="v-title">Titel</h1>
    <p class="vote-desc" id="v-desc">Beschreibung</p>
  </div>
  <div class="vote-img-wrap" id="vote-wrap" onclick="castVote()">
    <img id="img-vote" src="" alt="Voting Bild">
    <div class="vote-count-overlay">
      <div class="vote-count-big" id="vote-count-num">0</div>
      <div class="vote-count-label"><span class="live-dot"></span> Klicks</div>
    </div>
    <div class="click-hint" id="click-hint">Klick, wenn du das so kanntest!</div>
    <div class="voted-check" id="voted-check">✓</div>
  </div>
</div>

<!-- RESULTS: Bild 2 mit Auswertung -->
<div class="screen" id="s-results">
  <div class="result-header">
    <div class="pair-counter" id="r-counter">Beispiel 1 von 20</div>
    <h2 class="result-title" id="r-title">Auflösung</h2>
    <p class="result-sub" id="r-desc"></p>
  </div>
  <div class="result-img-wrap">
    <img id="r-img" src="" alt="Auflösungs-Bild">
    <div class="result-stats-overlay">
      <div class="r-stat-big" id="r-pct">0%</div>
      <div class="r-stat-label" id="r-label">hatten diese falsche Erinnerung</div>
      <div class="r-stat-sub" id="r-total">von 0 Teilnehmern</div>
      <div class="r-bar-wrap"><div class="r-bar-fill" id="r-bar" style="width:0%"></div></div>
    </div>
  </div>
</div>

<!-- SUMMARY -->
<div class="screen" id="s-summary">
  <div class="summary-header">
    <h1 class="summary-title">Gesamt<span>auswertung</span></h1>
    <p style="color:var(--muted);margin-top:8px">Alle 20 Mandela-Effekt-Beispiele im Überblick</p>
  </div>
  <div class="summary-grid" id="summary-grid"></div>
</div>

<script>
const SUPA_URL = 'https://mgvjyyzurobcffulqyia.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ndmp5eXp1cm9iY2ZmdWxxeWlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4MDE3NDIsImV4cCI6MjEwNjM3Nzc0Mn0.PQwuSNJAohKL_l3rSS_VJZPMNnVGJYck0ccxkETbo2w';
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);

let sessionId = localStorage.getItem('mandela_sid');
if (!sessionId) { sessionId = crypto.randomUUID(); localStorage.setItem('mandela_sid', sessionId); }

let pairs = [], state = null, myVotes = {};

async function init() {
  const { data: p } = await sb.from('image_pairs').select('*').order('order_num');
  pairs = p || [];
  const { data: v } = await sb.from('votes').select('image_pair_id,voted_side').eq('session_id', sessionId);
  (v || []).forEach(x => myVotes[x.image_pair_id] = x.voted_side);
  const { data: st } = await sb.from('presentation_state').select('*').eq('id', 1).single();
  applyState(st);

  sb.channel('state_ch').on('postgres_changes',
    { event: 'UPDATE', schema: 'public', table: 'presentation_state' },
    p => applyState(p.new)
  ).subscribe();

  sb.channel('votes_ch').on('postgres_changes',
    { event: 'INSERT', schema: 'public', table: 'votes' },
    () => { refreshLiveCount(); refreshResultsLive(); }
  ).subscribe();
}

function applyState(st) {
  state = st;
  const pair = pairs[st.current_pair_index];
  showScreen(st.phase);
  if (st.phase === 'voting') renderVoting(pair, st.current_pair_index);
  if (st.phase === 'results') renderResults(pair, st.current_pair_index);
  if (st.phase === 'summary') renderSummary();
}

function showScreen(phase) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const map = { waiting:'s-waiting', voting:'s-voting', results:'s-results', summary:'s-summary' };
  document.getElementById(map[phase])?.classList.add('active');
}

function renderVoting(pair, idx) {
  document.getElementById('v-counter').textContent = `Beispiel ${idx + 1} von ${pairs.length}`;
  document.getElementById('v-title').textContent = pair.title;
  document.getElementById('v-desc').textContent = pair.description;
  document.getElementById('img-vote').src = pair.image_left_url;
  const hasClicked = !!myVotes[pair.id];
  const wrap = document.getElementById('vote-wrap');
  wrap.className = 'vote-img-wrap' + (hasClicked ? ' voted' : '');
  document.getElementById('click-hint').textContent = hasClicked ? '✓ Du hast geklickt!' : 'Klick, wenn du das so kanntest!';
  document.getElementById('voted-check').style.display = hasClicked ? 'flex' : 'none';
  refreshLiveCount();
}

async function refreshLiveCount() {
  if (!state || state.phase !== 'voting') return;
  const pair = pairs[state.current_pair_index];
  const { count } = await sb.from('votes').select('id', { count: 'exact', head: true }).eq('image_pair_id', pair.id);
  document.getElementById('vote-count-num').textContent = count || 0;
}

async function castVote() {
  const pair = pairs[state.current_pair_index];
  if (myVotes[pair.id]) return;
  const { error } = await sb.from('votes').insert({ session_id: sessionId, image_pair_id: pair.id, voted_side: 'left' });
  if (!error) { myVotes[pair.id] = 'left'; renderVoting(pair, state.current_pair_index); }
}

async function renderResults(pair, idx) {
  document.getElementById('r-counter').textContent = `Beispiel ${idx + 1} von ${pairs.length}`;
  document.getElementById('r-title').textContent = pair.title;
  document.getElementById('r-desc').textContent = pair.description;
  document.getElementById('r-img').src = pair.image_right_url;
  await updateResultStats(pair.id);
}

async function refreshResultsLive() {
  if (!state || state.phase !== 'results') return;
  const pair = pairs[state.current_pair_index];
  await updateResultStats(pair.id);
}

async function updateResultStats(pairId) {
  const { count: total } = await sb.from('votes').select('id', { count: 'exact', head: true }).eq('image_pair_id', pairId);
  const pct = total ? Math.round(total / 30 * 100) : 0;
  document.getElementById('r-pct').textContent = `${pct}%`;
  document.getElementById('r-label').textContent = 'hatten diese falsche Erinnerung';
  document.getElementById('r-total').textContent = `${total || 0} von 30 Teilnehmern`;
  document.getElementById('r-bar').style.width = `${pct}%`;
}

async function renderSummary() {
  const grid = document.getElementById('summary-grid');
  grid.innerHTML = '';
  for (const pair of pairs) {
    const { data } = await sb.from('votes').select('voted_side').eq('image_pair_id', pair.id);
    const total = data?.length || 0;
    const left = data?.filter(v => v.voted_side === 'left').length || 0;
    const right = total - left;
    const lp = total ? Math.round(left / total * 100) : 0;
    const rp = 100 - lp;
    grid.innerHTML += `
    <div class="sum-card">
      <img src="${pair.image_left_url}" alt="">
      <div class="sum-body">
        <div class="sum-num"># ${pair.order_num}</div>
        <div class="sum-name">${pair.title}</div>
        <div class="sum-bars">
          <div class="sum-bar-row">
            <div class="sum-bar-track"><div class="sum-bar-fill fill-left" style="width:${lp}%"></div></div>
            <div class="sum-bar-info">${pair.left_label}: ${lp}%</div>
          </div>
          <div class="sum-bar-row">
            <div class="sum-bar-track"><div class="sum-bar-fill fill-right" style="width:${rp}%"></div></div>
            <div class="sum-bar-info">${pair.right_label}: ${rp}%</div>
          </div>
        </div>
      </div>
    </div>`;
  }
}

init();
</script>
</body>
</html>
